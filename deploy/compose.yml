# Production stack on the VPS (/opt/keyboardfast). Caddy terminates HTTPS and
# proxies to the app; further sites can be added as services + Caddyfile blocks.
services:
  keyboardfast:
    image: ghcr.io/furkanhaltas/keyboardfast:latest
    restart: unless-stopped
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - keyboardfast

volumes:
  caddy_data:
  caddy_config:
